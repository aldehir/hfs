# Editor setup for working on the Space over `hfs ssh`. Best-effort: a failure
# here shouldn't block serving a model.
- name: Clone nvim config
  ansible.builtin.command: git clone {{ devenv_nvim_repo }} {{ devenv_nvim_dir }}
  args:
    creates: "{{ devenv_nvim_dir }}/.git"
  register: devenv_nvim
  failed_when: false

- name: Warn if the nvim config could not be cloned
  ansible.builtin.debug:
    msg: "{{ devenv_nvim.stderr }}"
  when: devenv_nvim.rc | default(0) != 0

# Runs under hfsd: plugin installs can outlast the gateway's 5 minute limit.
- name: Install nvim plugins
  ansible.builtin.command: "{{ hfsd }} run nvim-plugins -- nvim --headless +qa"
  when: devenv_nvim is changed and devenv_nvim.rc == 0
