hfs_home: /home/user/.hfs
hfs_logs: "{{ hfs_home }}/logs"
hfsd: "{{ hfs_home }}/bin/hfsd"
hfsd_persist: /data/hfs/hfsd
# Over SSH the hfsd role installs and starts hfsd. Over the hfsd connection
# `hfs` upgrades it through its API instead.
hfsd_managed: true

# llama.cpp source and build. The tree stays container-local for fast builds;
# finished binaries persist on /data. Keep small-file caches (ccache) off /data:
# it's a bucket mount, and they slow the Space's startup.
llama_repo: ggml-org/llama.cpp
llama_ref: master
llama_pr: ~
llama_update: true
llama_fetch_ref: "{{ 'pull/%s/head' % llama_pr if llama_pr else llama_ref }}"
llama_src: /home/user/llama.cpp
llama_targets: [llama-server, llama-bench]
llama_cmake_flags:
  - -DGGML_CUDA=ON
  - -DCMAKE_CUDA_ARCHITECTURES=89
  - -DBUILD_SHARED_LIBS=OFF
llama_build_cache: /data/builds
# Extra environment for the build job.
llama_build_env: {}

# llama-server
model: ~
server_host: 127.0.0.1
server_port: 8080
server_args: []
server_env: {}
server_env_defaults:
  LLAMA_CACHE: /data/cache
  HF_HOME: /data/.huggingface
server_env_args: "{{ (server_env_defaults | combine(server_env)).items() | map('join', '=') | map('regex_replace', '^', '--env=') | list }}"
# Must match hfsd's --upstream-prefix: the web UI is served under it, and hfsd
# rewrites root API paths (/v1/...) into it.
server_prefix: /llama
server_argv: "{{ ['--host', server_host, '--port', server_port | string, '--api-prefix', server_prefix, '-hf', model] + (server_args | flatten | map('string') | list) }}"
server_health_timeout: 1800

# llama-bench
bench_args: []
bench_dir: /data/bench
