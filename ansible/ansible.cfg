[defaults]
interpreter_python = /usr/bin/python3
gathering = explicit
host_key_checking = False
retry_files_enabled = False
callback_result_format = yaml
callbacks_enabled = profile_tasks
display_skipped_hosts = False
# The SSH user is the Space's subdomain, not a remote account, so ~user
# doesn't expand.
remote_tmp = /tmp/.ansible/tmp

[ssh_connection]
# The gateway drops multiplexed master connections after a few sessions.
ssh_args = -o ControlMaster=no
pipelining = True
# The Dev Mode SSH gateway has no sftp subsystem.
transfer_method = piped
# Piping a file through a tty truncates long lines, which corrupts the
# async wrapper.
usetty = False
